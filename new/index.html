<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#ffd166" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ケイサンの壁" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>ケイサンの壁</title>
  <link rel="manifest" href="manifest.webmanifest?v=20260613-02" />
  <link rel="icon" href="icon.svg?v=20260613-02" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preload" href="assets/title-hero.png" as="image" />
  <link rel="preload" href="assets/chara01_kurage.png" as="image" />
  <link rel="preload" href="assets/chara02_fugu.png" as="image" />
  <link rel="stylesheet" href="style.css?v=20260613-02" />
</head>
<body>
  <button class="sound-toggle" id="soundToggle" type="button" aria-label="効果音のオン・オフ">🔊</button>

  <main class="app">
    <div class="countdown" id="countdown" hidden>3</div>

    <section class="panel title-screen" id="titleScreen">
      <div>
        <h1>ケイサンの壁</h1>
        <p>レベルをえらんでスタート</p>
      </div>
      <div class="character-stage" aria-label="キャラクター">
        <button class="character-button character-left" type="button" aria-label="くらげのキャラクター">
          <img src="assets/chara01_kurage.png" alt="" />
        </button>
        <button class="character-button character-right" type="button" aria-label="ふぐのキャラクター">
          <img src="assets/chara02_fugu.png" alt="" />
        </button>
      </div>
      <div class="xp-card" id="xpCard" aria-label="けいさんレベル"></div>
      <div class="course-groups" aria-label="レベル選択">
        <section class="course-group">
          <h2>小学生</h2>
          <div class="level-options">
            <button data-level="elementary" type="button">
              <b>ふつう</b>
              <span>かけ算・わり算</span>
                          <span class="medals" data-medals="elementary" aria-hidden="true"></span>
            </button>
            <button data-level="hard" type="button">
              <b>難しい</b>
              <span>2桁と2桁</span>
                          <span class="medals" data-medals="hard" aria-hidden="true"></span>
            </button>
            <button data-level="oni" type="button">
              <b>鬼</b>
              <span>3桁と2桁</span>
                          <span class="medals" data-medals="oni" aria-hidden="true"></span>
            </button>
          </div>
        </section>
        <section class="course-group">
          <h2>中学生</h2>
          <div class="level-options">
            <button data-level="middle" type="button">
              <b>ふつう</b>
              <span>正負の加減乗除</span>
                          <span class="medals" data-medals="middle" aria-hidden="true"></span>
            </button>
            <button data-level="middleHard" type="button">
              <b>難しい</b>
              <span>3つの数の計算</span>
                          <span class="medals" data-medals="middleHard" aria-hidden="true"></span>
            </button>
            <button data-level="middleOni" type="button">
              <b>鬼</b>
              <span>累乗入り</span>
                          <span class="medals" data-medals="middleOni" aria-hidden="true"></span>
            </button>
          </div>
        </section>
      </div>
      <button class="ranking-toggle" id="showRankings" type="button">ランキングを見る</button>
    </section>

    <section class="panel ranking-screen" id="rankingScreen" hidden>
      <div class="ranking-hero" aria-hidden="true">
        <img src="assets/title-hero.png" alt="" />
      </div>
      <div class="ranking-content">
        <div>
          <h2>ランキング</h2>
          <p>コース別ベスト10</p>
        </div>
        <div class="ranking-tabs" id="rankingTabs" aria-label="ランキングのコース選択"></div>
        <div class="ranking" id="titleRankingList"></div>
        <button class="home-btn" id="rankingHome" type="button">ホームに戻る</button>
      </div>
    </section>

    <section class="panel main game-ui" aria-live="polite" hidden>
      <div class="timer-chip" id="timer">00:00.000</div>

      <div class="score-row">
        <div class="stat"><b id="count">1/10</b><span>いま</span></div>
        <div class="stat"><b id="correct">0</b><span>正解</span></div>
        <div class="stat"><b id="streak">0</b><span>れんぞく</span></div>
      </div>

      <div class="question-card">
        <div>
          <p class="question" id="question">3 × 4</p>
          <div class="answer-box" id="answer">?</div>
          <div class="feedback" id="feedback">テンキーで答えてね</div>
        </div>
      </div>
    </section>

    <section class="panel progress-panel game-ui" hidden>
      <div class="progress-dots" id="progressDots" aria-label="進み具合"></div>
    </section>

    <aside class="panel controls game-ui" hidden>
      <div class="keypad" aria-label="テンキー">
        <button class="key" data-key="7" type="button">7</button>
        <button class="key" data-key="8" type="button">8</button>
        <button class="key" data-key="9" type="button">9</button>
        <button class="key" data-key="4" type="button">4</button>
        <button class="key" data-key="5" type="button">5</button>
        <button class="key" data-key="6" type="button">6</button>
        <button class="key" data-key="1" type="button">1</button>
        <button class="key" data-key="2" type="button">2</button>
        <button class="key" data-key="3" type="button">3</button>
        <button class="key sign" data-action="sign" type="button">±</button>
        <button class="key" data-key="0" type="button">0</button>
        <button class="key enter" data-action="enter" type="button">OK</button>
      </div>

      <div class="small-actions">
        <button id="clearInput" type="button">けす</button>
        <button id="newSet" type="button">はじめから</button>
        <button id="levelSelect" type="button">レベル選択</button>
      </div>
    </aside>

    <section class="panel result" id="result">
      <h2 id="resultTitle">結果</h2>
      <div class="result-time" id="resultTime"></div>
      <div class="result-badges" id="resultBadges"></div>
      <p id="resultText"></p>
      <div class="ranking" id="ranking"></div>
      <div class="result-actions">
        <button class="restart" id="retryBtn" type="button">もう1回</button>
        <button class="home-btn" id="homeBtn" type="button">ホームに戻る</button>
      </div>
    </section>
  </main>

  <script src="script.js?v=20260613-02"></script>
</body>
</html>
